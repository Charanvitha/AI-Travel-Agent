services:
  - type: web
    name: atlasai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: atlasai-db
          property: connectionString

databases:
  - name: atlasai-db
    databaseName: atlasai
    user: atlasai
    plan: free
